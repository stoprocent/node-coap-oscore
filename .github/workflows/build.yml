name: Build
on:
  push:
    branches:
      - main
      - beta
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # semantic-release: create git tags + GitHub releases
      issues: write          # @semantic-release/github: comment on released issues
      pull-requests: write   # @semantic-release/github: comment on released PRs
      id-token: write        # npm OIDC trusted publishing (no NPM_TOKEN needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
